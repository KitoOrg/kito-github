[package]
name = "kito-github"
description = "GitHub for Kito: signing in to a server, and issues as the tasks of lanes"
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "kito-github"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
getrandom = "0.2"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.dist]
inherits = "release"
debug = false
strip = true
