name = "github"
version = "0.1.0"
description = "Sign in to a Kito server with GitHub"
api = 1
# It says who somebody is (`sign_in`), and adds `kito-server github`, with
# which an administrator says which OAuth app is the server's
# (`server_admin`). It is given nothing of any repository.
permissions = ["sign_in", "server_admin"]

[sign_in]
method = "github"
about = "Sign in with GitHub"

[[server_command]]
name = "github"
about = "Set up signing in with GitHub: setup <client id> | status"
