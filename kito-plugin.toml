name = "github"
version = "0.4.0"
description = "GitHub for Kito: sign in, keep a repository in step with one at GitHub, and its issues as tasks"
api = 1
# On a server it says who somebody is (`sign_in`), and adds `kito-server
# github`, with which an administrator says which OAuth app is the
# server's (`server_admin`). In a repository it reads what a lane is for
# (`read`), to tell the issue the lane's task names; and makes Kito's
# tasks of the issues, with what is said on them (`write`, Kito 0.33). It
# changes no file of the repository.
permissions = ["read", "write", "integrate", "admin", "sign_in", "pages", "server_admin"]

# On a server (Kito 0.39): pages under /github, where an administrator
# makes the server's GitHub App and GitHub sends its webhooks; and, as the
# plugin itself (ADR 0020 of Kito), a repository linked to one at GitHub
# kept in step: its code pulled and pushed (`integrate` to bring GitHub's
# commits in, `admin` to make GitHub its git remote), its issues as tasks.
[pages]
mount = "/github"

[sign_in]
method = "github"
about = "Sign in with GitHub"

[[server_command]]
name = "github"
about = "Set up signing in with GitHub: setup <client id> | status"

[[command]]
name = "github"
about = "Issues at GitHub as Kito's tasks: link <owner>/<repository> | token --from <file> | status | sync | issues | issue <number>"

# A lane whose task is an issue: the issue is told when the lane is opened,
# and told and closed when it is integrated. A task made of an issue: what
# is said on it, and its closing, dropping or reopening, go to the issue.
[[event]]
kinds = ["lane_opened", "integrated", "task_comment", "task_done", "task_changed"]

[[tool]]
name = "issues"
description = "The open issues of this project at GitHub: what is asked for and not done yet. Each comes with the `task` to open a lane with."
input = { type = "object", properties = {} }

[[tool]]
name = "issue"
description = "One issue at GitHub, with what was said on it. Read it before working on it, and open your lane with `task` set to the task it gives: the issue is then told, and closed when your lane is integrated."
input = { type = "object", properties = { number = { type = "integer", description = "The number of the issue, as `issues` lists it" } }, required = ["number"] }
